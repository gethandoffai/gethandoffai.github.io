<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Competitor Watch map</title>
<meta property="og:title" content="Competitor Watch demo · Handoff">
<meta property="og:description" content="See what every competitor near you did this week. Demo built on sample data.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#07090f; --panel:rgba(13,17,27,.86); --panel2:#121828; --line:rgba(255,255,255,.09);
  --fg:#eef1f7; --mute:#8a93a6; --blue:#4f7bff; --gold:#ffb347; --red:#ff6f6f; --green:#7fd36b;
  --teal:#46c9d6; --violet:#9a6cf0; --hl:#ffd84d;
  --display:'Outfit',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pinlab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;background:rgba(10,13,22,.88);
  border:1px solid var(--c);border-radius:10px;padding:5px 9px;white-space:nowrap;font:600 12px/1.2 var(--body);
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent);transition:opacity .2s}
.pinlab b{display:block;font:700 13px/1.15 var(--display)}
.pinlab small{color:var(--mute);font:500 11px var(--mono)}
.pinlab.me{background:var(--blue);border-color:#fff;color:#fff}
.pinlab.me small{color:#dfe6ff}

/* top bar */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(#07090fee,#07090f00);pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font:700 17px var(--display);letter-spacing:-.01em}
.brand img{width:26px;height:26px}
.ttl{display:flex;flex-direction:column;line-height:1.15;border-left:1px solid var(--line);padding-left:12px}
.ttl b{font:700 17px var(--display)}
.ttl span{color:var(--mute);font-size:12px}
.chip{margin-left:auto;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
  border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:99px;padding:4px 10px}

/* side panel */
#panel{position:absolute;right:16px;top:76px;bottom:16px;width:360px;background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
#panel .scroll{flex:1;overflow:auto;padding:16px}
#panel h3{margin:0 0 4px;font:700 18px var(--display)}
#panel .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.row:hover{background:rgba(255,255,255,.03)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font:600 14px var(--body)}
.row .nm small{color:var(--mute);font:500 12px var(--mono)}
.tag{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:6px;
  background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 10px;font-weight:600}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.back{background:none;border:0;color:var(--mute);padding:0 0 10px;font-size:13px}
.det h2{margin:4px 0 2px;font:800 24px/1.1 var(--display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel2);border-radius:12px;padding:10px}
.stat b{display:block;font:600 18px var(--mono)}
.stat small{color:var(--mute);font-size:11px}
.post{background:var(--panel2);border-radius:14px;padding:12px;border-left:3px solid var(--c);margin:10px 0}
.post small{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.post p{margin:4px 0 0;font-weight:500}
.tip{display:flex;gap:10px;background:color-mix(in srgb,var(--blue) 14%,transparent);border:1px solid color-mix(in srgb,var(--blue) 40%,transparent);
  border-radius:14px;padding:12px;margin-top:10px;font-size:14px}
.tip img{width:20px;height:20px;flex:none;margin-top:1px}

/* modals */
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,6,10,.6);padding:16px}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:22px}
.sheet h2{margin:0 0 4px;font:800 24px var(--display)}
.sheet .sub{color:var(--mute);margin-bottom:16px;font-size:14px}
.x{float:right;background:none;border:0;color:var(--mute);font-size:22px;line-height:1}
.bar{margin:14px 0}
.bar .lbl{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px}
.bar .lbl em{font-style:normal;color:var(--gold);font:600 12px var(--mono);text-transform:uppercase}
.track{display:flex;align-items:center;gap:8px;margin:4px 0;font:500 12px var(--mono);color:var(--mute)}
.track span{width:64px;flex:none}
.track i{height:12px;border-radius:6px;background:var(--mute);display:block;transform-origin:left}
.track i.you{background:var(--blue);box-shadow:0 0 12px var(--blue)}
.track b{color:var(--fg)}
.move{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.move .n{width:30px;height:30px;border-radius:9px;background:var(--c);color:#0b0e16;display:grid;place-items:center;font:800 16px var(--display);flex:none}
.move h4{margin:0 0 3px;font:700 16px var(--display)}
.move p{margin:0;color:#c9cfdc;font-size:14px}
.ready{display:inline-block;margin-top:8px;font:600 12px var(--mono);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 50%,transparent);border-radius:99px;padding:3px 10px}

@media (max-width:820px){
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:48%;border-radius:20px 20px 0 0;border-bottom:0}
  .actions{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .ttl span{display:none}
  .chip{font-size:10px;padding:3px 8px}
}

/* ---------- tour (vertical video) ---------- */
body.tour #app{inset:auto;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
body.tour #top,body.tour #panel{display:none}
body.tour .pinlab{font-size:22px;padding:10px 16px;border-radius:16px;border-width:2px}
body.tour .pinlab b{font-size:26px}
body.tour .pinlab small{font-size:20px}
#tour{display:none;position:absolute;inset:0;pointer-events:none}
body.tour #tour{display:block}
.tbrand{position:absolute;top:96px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;font:700 40px var(--display);opacity:.95}
.tbrand img{width:52px;height:52px}
.cap{position:absolute;top:200px;left:50px;right:50px;text-align:center;font:800 88px/1.02 var(--display);text-transform:uppercase;
  letter-spacing:-.01em;text-shadow:0 4px 30px #000,0 2px 6px #000}
.cap span{color:var(--hl)}
.tbox{position:absolute;bottom:300px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tbox div{background:#000;color:#fff;font:700 50px/1.15 var(--display);padding:10px 24px;border-radius:12px}
.tbox small{font:600 34px var(--display);color:#fff;text-shadow:0 2px 10px #000}
.counter{position:absolute;top:470px;left:70px;right:70px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.counter div{background:rgba(10,13,22,.85);border:2px solid var(--line);border-radius:22px;padding:20px;text-align:center}
.counter b{display:block;font:600 64px var(--mono)}
.counter small{color:var(--mute);font-size:26px}
.tcard{position:absolute;left:70px;right:70px;top:1010px;background:rgba(10,13,22,.92);border:2px solid var(--c);border-radius:30px;padding:34px;
  box-shadow:0 0 60px color-mix(in srgb,var(--c) 35%,transparent)}
.tcard .hd{display:flex;align-items:center;gap:18px}
.tcard .hd h2{margin:0;flex:1;font:800 50px/1.05 var(--display)}
.tcard .tag{font-size:26px;padding:8px 16px;border-radius:12px}
.tcard .stats{gap:16px;margin:22px 0}
.tcard .stat{border-radius:18px;padding:16px}
.tcard .stat b{font-size:40px}
.tcard .stat small{font-size:22px}
.tcard .post{border-radius:20px;padding:20px;border-left-width:6px;margin:0}
.tcard .post small{font-size:20px}
.tcard .post p{font-size:32px;line-height:1.25}
.tbars{position:absolute;left:70px;right:70px;top:540px;background:rgba(10,13,22,.92);border:2px solid var(--line);border-radius:30px;padding:36px}
.tbars h2{margin:0 0 10px;font:800 50px var(--display)}
.tbars .bar{margin:34px 0 10px}
.tbars .bar .lbl{font-size:34px}
.tbars .bar .lbl em{font-size:24px}
.tbars .track{font-size:26px;gap:16px;margin:10px 0}
.tbars .track span{width:150px}
.tbars .track i{height:30px;border-radius:15px}
.tbrief{position:absolute;left:60px;right:60px;top:600px;background:rgba(10,13,22,.94);border:2px solid var(--line);border-radius:30px;padding:36px}
.tbrief .hd{display:flex;align-items:center;gap:14px;font:700 30px var(--display);color:var(--mute)}
.tbrief .hd img{width:44px;height:44px}
.tbrief h2{margin:8px 0 6px;font:800 54px var(--display)}
.tbrief .move{padding:26px 0;gap:22px;border-top-width:2px}
.tbrief .move .n{width:58px;height:58px;border-radius:16px;font-size:32px}
.tbrief .move h4{font-size:38px}
.tbrief .move p{font-size:28px;line-height:1.3}
.tbrief .ready{font-size:24px;padding:6px 16px;margin-top:14px;border-width:2px}
.tend{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  background:radial-gradient(circle at 50% 45%,rgba(79,123,255,.28),rgba(7,9,15,.96) 60%)}
.tend .brand{font-size:64px;gap:18px}
.tend .brand img{width:88px;height:88px}
.tend .big{font:800 104px/1.05 var(--display);text-align:center;text-transform:uppercase}
.tend .big span{background:var(--hl);color:#111;padding:0 18px;border-radius:12px}
.tend p{margin:0;font:600 44px var(--display);color:#dfe4ee;text-align:center}
.tend small{color:var(--mute);font-size:28px;margin-top:40px}
</style>
</head>

  const cx = bx * BLOCK + 6, cz = bz * BLOCK + 6;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const x = cx - 2.6 + i * 5.2, z = cz - 2.6 + j * 5.2;
    if (PINS.some(p => Math.hypot(p.pos[0] - x, p.pos[1] - z) < 3)) continue;
    const d = Math.hypot(x, z), core = Math.max(0, 1 - d / 55);
    lots.push({ x, z, w:3.4 + rnd() * 1.1, dd:3.4 + rnd() * 1.1, h:(1.5 + rnd() * 5) * (1 + core * core * 4) });
  }
}
const bgeo = new THREE.BoxGeometry(1, 1, 1); bgeo.translate(0, .5, 0);
const bmat = new THREE.MeshStandardMaterial({ color:0x1c2742, roughness:.8, emissive:0xffffff, emissiveMap:windowTex(), emissiveIntensity:1.25 });
const city = new THREE.InstancedMesh(bgeo, bmat, lots.length);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
lots.forEach((l, i) => { m4.compose(new THREE.Vector3(l.x, 0, l.z), q, new THREE.Vector3(l.w, l.h, l.dd)); city.setMatrixAt(i, m4); });
scene.add(city);

// traffic
function traffic(n, color, size){
  const cars = [];
  const lines = [-36, 0, 36];
  for (let i = 0; i < n; i++) cars.push({ axis: rnd() < .5, line: lines[(rnd() * 3) | 0] + (rnd() < .5 ? -.5 : .5), off: rnd() * 144, sp: (6 + rnd() * 8) * (rnd() < .5 ? -1 : 1) });
  const g = new THREE.BufferGeometry(); const pos = new Float32Array(n * 3); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color, size, transparent:true, opacity:.95, blending:THREE.AdditiveBlending, depthWrite:false }));
  scene.add(pts);
  return t => { cars.forEach((c, i) => { const s = ((c.off + c.sp * t) % 144 + 144) % 144 - 72;
    pos[i*3] = c.axis ? s : c.line; pos[i*3+1] = .4; pos[i*3+2] = c.axis ? c.line : s; }); g.attributes.position.needsUpdate = true; };
}
const moveCars = [traffic(70, 0xffd8a0, 1.1), traffic(50, 0xff6f6f, .9)];

// pins
const add = THREE.AdditiveBlending;
PINS.forEach((p, i) => {
  const H = p.id === 'me' ? 30 : 20, col = new THREE.Color(p.color), g = new THREE.Group();
  g.position.set(p.pos[0], 0, p.pos[1]);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.7, .7, H, 20, 1, true), new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:.28, blending:add, depthWrite:false, side:THREE.DoubleSide }));
  beam.geometry.translate(0, H / 2, 0);
  const core = new THREE.Mesh(new THREE.CylinderGeometry(.14, .14, H, 8), new THREE.MeshBasicMaterial({ color:col }));
  core.geometry.translate(0, H / 2, 0);
  const head = new THREE.Mesh(new THREE.SphereGeometry(p.id === 'me' ? 1.6 : 1.2, 24, 16), new THREE.MeshBasicMaterial({ color:col }));
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.4, 2, 48), new THREE.MeshBasicMaterial({ color:col, transparent:true, side:THREE.DoubleSide, blending:add, depthWrite:false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = .06;
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(6.5, 6.5), new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:.22, blending:add, depthWrite:false }));
  pad.rotation.x = -Math.PI / 2; pad.position.y = .04;
  g.add(beam, core, head, ring, pad); scene.add(g);
  const lab = document.createElement('div'); lab.className = 'pinlab' + (p.id === 'me' ? ' me' : ''); lab.style.setProperty('--c', p.color);
  lab.innerHTML = p.id === 'me' ? `<b>You</b><small>★ ${p.stars} · ${p.reviews}</small>` : `<b>${p.name}</b><small>★ ${p.stars} · $${p.latte.toFixed(2)}</small>`;
  lab.onclick = () => select(p.id);
  $('#labels').appendChild(lab);
  p.o = { g, beam, core, head, ring, pad, H, lab, phase: i * .17 };
});

const ease = x => { x = Math.min(1, Math.max(0, x)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = Math.min(1, Math.max(0, x)); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b, f = .35) => Math.max(0, Math.min(ease((t - a) / f), ease((b - t) / f)));

function setPin(p, drop, hi, t){
  const o = p.o, d = Math.min(1, Math.max(0, drop));
  o.g.visible = d > 0;
  o.beam.scale.y = o.core.scale.y = ease(d);
  o.head.position.y = o.H + (1 - back(d)) * 30;
  o.head.scale.setScalar(1 + hi * .6);
  o.beam.material.opacity = .22 + hi * .3;
  const f = ((t * .7 + o.phase) % 1);
  o.ring.scale.setScalar(1 + f * 3.2); o.ring.material.opacity = (1 - f) * .85 * d;
  o.pad.material.opacity = (.16 + hi * .25) * d;
  o.vis = d > .6;
}
const v3 = new THREE.Vector3();
function placeLabels(w, h, dim){
  PINS.forEach(p => { const o = p.o; v3.set(p.pos[0], o.H + 2.6, p.pos[1]).project(camera);
    const ok = o.vis && v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1;
    o.lab.style.opacity = ok ? (dim && dim !== p.id ? .35 : 1) : 0;
    o.lab.style.transform = `translate(${(v3.x * .5 + .5) * w}px,${(-v3.y * .5 + .5) * h}px) translate(-50%,-100%)`; });
}
function setCam(tx, tz, dist, az, el){
  camera.position.set(tx + Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist, tz + Math.cos(az) * Math.cos(el) * dist);
  camera.lookAt(tx, 0, tz);
}
function size(w, h){ renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }

// ---------- shared HTML bits ----------
const stars = n => '★ ' + n.toFixed(1);
function detailHTML(p, big){
  return `<div class="hd"><span class="dot" style="--c:${p.color}"></span><h2>${p.name}</h2><span class="tag" style="--c:${p.color}">${p.tag}</span></div>
  <div class="stats"><div class="stat"><b>${stars(p.stars)}</b><small>${p.reviews.toLocaleString()} reviews</small></div>
  <div class="stat"><b>$${p.latte.toFixed(2)}</b><small>latte</small></div><div class="stat"><b>${p.posts}</b><small>posts this week</small></div></div>
  <div class="post" style="--c:${p.color}"><small>${p.ago}</small><p>${p.latest}</p></div>`;
}
function barsHTML(){
  return BARS.map(b => { const mx = Math.max(b.you, b.them);
    return `<div class="bar"><div class="lbl">${b.lbl}<em>${b.verdict}</em></div>
    <div class="track"><span>You</span><i class="you" style="width:${b.you / mx * 70}%"></i><b>${b.fmt(b.you)}</b></div>
    <div class="track"><span>Area avg</span><i style="width:${b.them / mx * 70}%"></i><b>${b.fmt(b.them)}</b></div></div>`; }).join('');
}
function movesHTML(){
  return MOVES.map((m, i) => `<div class="move" style="--c:${byId[m.who].color}"><div class="n">${i + 1}</div><div><h4>${m.title}</h4><p>${m.text}</p><span class="ready">✓ ${m.ready}</span></div></div>`).join('');
}

// ---------- interactive mode ----------
let sel = null;
const cam = { tx:0, tz:0, dist:150, az:.6, el:.82 }, want = { tx:0, tz:0, dist:150 };
function listView(){
  $('#pscroll').innerHTML = `<h3>This week near you</h3><div class="sub">6 coffee shops within 2 miles. Checked every morning.</div>` +
    RIVALS.map(r => `<button class="row" data-id="${r.id}"><span class="dot" style="--c:${r.color}"></span><span class="nm"><b>${r.name}</b><small>${stars(r.stars)} · $${r.latte.toFixed(2)} latte</small></span><span class="tag" style="--c:${r.color}">${r.tag}</span></button>`).join('');
  $('#pscroll').querySelectorAll('.row').forEach(b => b.onclick = () => select(b.dataset.id));
}
function select(id){
  if (TOUR) return;
  const p = byId[id]; if (!p || id === 'me') { sel = null; want.tx = 0; want.tz = 0; want.dist = 150; listView(); return; }
  sel = id; want.tx = p.pos[0]; want.tz = p.pos[1]; want.dist = 60;
  $('#pscroll').innerHTML = `<button class="back" id="bk">‹ All competitors</button><div class="det">${detailHTML(p)}</div>
    <div class="tip"><img src="${MARK}" alt=""><div>${p.tip}</div></div>`;
  $('#bk').onclick = () => select('me');
  $('#pscroll').scrollTop = 0;
}
function openModal(html){ $('#sheet').innerHTML = '<button class="x" id="mx" aria-label="Close">×</button>' + html; $('#modal').hidden = false; $('#mx').onclick = () => $('#modal').hidden = true; }
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').hidden = true; };
$('#bStack').onclick = () => openModal(`<h2>How you stack up</h2><div class="sub">You vs the 6 shops near you, this week.</div>${barsHTML()}`);
$('#bBrief').onclick = () => openModal(`<h2>Monday brief</h2><div class="sub">3 moves to make this week, based on what your competitors did.</div>${movesHTML()}`);

// drag + zoom
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e => { if (!drag) return; cam.az -= (e.clientX - drag.x) * .005; cam.el = Math.min(1.3, Math.max(.35, cam.el + (e.clientY - drag.y) * .004)); drag = { x:e.clientX, y:e.clientY }; });
renderer.domElement.addEventListener('pointerup', () => drag = null);
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); want.dist = Math.min(260, Math.max(35, want.dist * (1 + e.deltaY * .001))); }, { passive:false });

// ---------- tour (video) ----------
const at = id => byId[id].pos;
const KEYS = [
  [0,    { t:[0,0],        dist:260, az:.15, el:1.12 }],
  [3.2,  { t:[0,0],        dist:150, az:.5,  el:.86 }],
  [6.2,  { t:[0,0],        dist:140, az:.7,  el:.8 }],
  [7.3,  { t:at('grind'),  dist:95,  az:.95, el:.72 }],
  [9.5,  { t:at('grind'),  dist:88,  az:1.1, el:.7 }],
  [10.4, { t:at('ember'),  dist:95,  az:1.25,el:.72 }],
  [12.5, { t:at('ember'),  dist:88,  az:1.4, el:.7 }],
  [13.4, { t:at('fox'),    dist:95,  az:1.55,el:.72 }],
  [15.5, { t:at('fox'),    dist:88,  az:1.7, el:.7 }],
  [16.6, { t:[0,-10],      dist:190, az:2.0, el:1.0 }],
  [25,   { t:[0,-10],      dist:210, az:2.6, el:1.05 }],
];
function camAt(t){
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const [t0, a] = KEYS[i], [t1, b] = KEYS[i + 1], k = ease((t - t0) / (t1 - t0)), L = (x, y) => x + (y - x) * k;
  return [L(a.t[0], b.t[0]), L(a.t[1], b.t[1]), L(a.dist, b.dist), L(a.az, b.az), L(a.el, b.el)];
}
const CAPS = [
  [0, 3.1, 'What did your<br>competitors do<br><span>this week?</span>'],
  [3.1, 6.4, 'We check<br><span>every one.</span>'],
  [6.4, 9.7, 'New promo<br><span>spotted.</span>'],
  [9.7, 12.7, 'Price<br><span>went up.</span>'],
  [12.7, 15.8, 'What\'s getting<br><span>views.</span>'],
  [15.8, 18.8, 'How you<br><span>stack up.</span>'],
  [18.8, 22.7, 'Every Monday:<br><span>3 moves to make.</span>'],
];
const CARDS = [['grind', 7.2, 9.8], ['ember', 10.3, 12.9], ['fox', 13.3, 15.9]];
let cardId = null, capIdx = -1;
$('#tbars').innerHTML = `<h2>You vs 6 shops near you</h2>${barsHTML()}`;
$('#tbrief').innerHTML = `<div class="hd"><img src="${MARK}" alt="">Monday brief · Nov 2</div><h2>3 moves this week</h2>${movesHTML()}`;
const tbarsI = [...document.querySelectorAll('#tbars .track i')], tmoves = [...document.querySelectorAll('#tbrief .move')], tready = [...document.querySelectorAll('#tbrief .ready')];
const counters = [...document.querySelectorAll('#counter b')];

function tourFrame(t){
  const [tx, tz, dist, az, el] = camAt(t); setCam(tx, tz, dist, az, el);
  const focus = CARDS.find(c => t > c[1] - .4 && t < c[2] + .2);
  PINS.forEach((p, i) => setPin(p, (t - (p.id === 'me' ? 3.0 : 3.35 + (i - 1) * .38)) / .7, focus && focus[0] === p.id ? win(t, focus[1] - .4, focus[2] + .2) : 0, t));
  moveCars.forEach(f => f(t));
  // caption
  const ci = CAPS.findIndex(c => t >= c[0] && t < c[1]); const cap = $('#cap');
  if (ci !== capIdx) { capIdx = ci; cap.innerHTML = ci < 0 ? '' : CAPS[ci][2]; }
  if (ci >= 0) { const [a, b] = CAPS[ci]; const o = win(t, a, b, .22); cap.style.opacity = o; cap.style.transform = `scale(${.92 + .08 * back((t - a) / .35)})`; }
  // counter
  const co = win(t, 3.3, 6.5); $('#counter').style.opacity = co; $('#counter').style.transform = `translateY(${(1 - co) * 30}px)`;
  const k = ease((t - 3.5) / 2.4); counters.forEach(b => b.textContent = Math.round(+b.dataset.n * k).toLocaleString());
  // competitor card
  const card = $('#tcard');
  if (focus) { if (cardId !== focus[0]) { cardId = focus[0]; const p = byId[cardId]; card.style.setProperty('--c', p.color); card.innerHTML = detailHTML(p); }
    const o = win(t, focus[1], focus[2], .3); card.style.opacity = o; card.style.transform = `translateY(${(1 - o) * 80}px)`; }
  else card.style.opacity = 0;
  // bars
  const bo = win(t, 15.9, 18.9); $('#tbars').style.opacity = bo; $('#tbars').style.transform = `translateY(${(1 - bo) * 60}px)`;
  tbarsI.forEach((el, i) => el.style.transform = `scaleX(${ease((t - 16.3 - Math.floor(i / 2) * .35) / .8)})`);
  // brief
  const ro = win(t, 18.9, 22.8); $('#tbrief').style.opacity = ro; $('#tbrief').style.transform = `translateY(${(1 - ro) * 60}px)`;
  tmoves.forEach((m, i) => { const o = ease((t - 19.4 - i * .85) / .4); m.style.opacity = o; m.style.transform = `translateX(${(1 - o) * 60}px)`; });
  tready.forEach((r, i) => { const o = (t - 19.9 - i * .85) / .35; r.style.opacity = Math.min(1, Math.max(0, o)); r.style.transform = `scale(${o <= 0 ? .4 : back(o)})`; });
  // title box + end
  $('#tbox').style.opacity = Math.min(1 - ro, 1 - ease((t - 22.4) / .3));
  $('.tbrand').style.opacity = 1 - ease((t - 22.4) / .3);
  const eo = ease((t - 22.6) / .45); $('#labels').style.opacity = (1 - eo) * (1 - .85 * Math.max(bo, ro)); $('#tend').style.opacity = eo; $('#tend').style.transform = `scale(${1.06 - .06 * eo})`;
  renderer.render(scene, camera);
  placeLabels(1080, 1920, focus ? focus[0] : null);
}

// ---------- boot ----------
if (TOUR) {
  size(1080, 1920);
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $('#app').style.transform = `scale(${s})`; $('#app').style.left = (innerWidth - 1080 * s) / 2 + 'px'; };
  fit(); addEventListener('resize', fit);
  window.seek = t => tourFrame(t);
  window.__ready = document.fonts.ready.then(() => { tourFrame(0); return DUR; });
  if (!RENDER) { const t0 = performance.now(); const loop = () => { tourFrame(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
} else {
  listView();
  const t0 = performance.now(); let last = t0;
  const resize = () => size(stage.clientWidth, stage.clientHeight); resize(); addEventListener('resize', resize);
  const loop = now => {
    const t = (now - t0) / 1000, dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!drag) cam.az += dt * .035;
    const f = 1 - Math.exp(-dt * 2.5);
    cam.tx += (want.tx - cam.tx) * f; cam.tz += (want.tz - cam.tz) * f; cam.dist += (want.dist - cam.dist) * f;
    setCam(cam.tx, cam.tz, cam.dist, cam.az, cam.el);
    PINS.forEach((p, i) => setPin(p, (t - .4 - i * .25) / .7, sel === p.id ? 1 : 0, t));
    moveCars.forEach(fn => fn(t));
    renderer.render(scene, camera);
    placeLabels(stage.clientWidth, stage.clientHeight, sel);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body></html>
