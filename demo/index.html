<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handoff: Your First AI Assistant</title>
<meta name="theme-color" content="#1b1b1b">
<link rel="icon" href="../mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one question per screen on a single card, progress ticks across the top.
   Stage 1 qualifies everyone; stage 2 (the build brief) only shows for qualified budgets.
   Handoff brand: dark first, rainbow only on the logo, one solid accent everywhere else. */
:root {
  --bg: #1b1b1b; --card: #232324; --field: #2c2c2e; --line: #39393d;
  --fg: #f2f2f3; --muted: #a3a5ab; --accent: #6f93ff; --on-accent: #111113; --accent-soft: #263150;
  --good: #7fd36b; --deal: #ffb347; --err: #ff8a80;
  --display: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f3f3f5; --card: #ffffff; --field: #f3f3f6; --line: #dedee4;
    --fg: #18181a; --muted: #5f6168; --accent: #2f5ee8; --on-accent: #ffffff; --accent-soft: #e6ecfd;
    --good: #2b8a3e; --deal: #a35c00; --err: #c0392b; color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 17px/1.6 var(--body);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; font: 700 22px/1 var(--display); letter-spacing: -.01em; }
.brand svg { width: 40px; height: 40px; flex: none; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ticks { display: flex; gap: 4px; }
.ticks span { height: 4px; flex: 1; border-radius: 2px; background: var(--line); transition: background .25s; }
.ticks span.on { background: var(--accent); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  padding: 32px; display: flex; flex-direction: column; gap: 22px;
}
h1 { font: 700 clamp(30px, 6.5vw, 44px)/1.08 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.02em; }
h2 { font: 600 clamp(23px, 4.8vw, 30px)/1.2 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; max-width: 60ch; }
.sub { color: var(--muted); }
.deal { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 15px; }
.deal b { font: 600 13px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--deal); }
.deal s { color: var(--muted); }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.how div { border-top: 2px solid var(--accent); padding-top: 12px; font-size: 15px; line-height: 1.5; }
.how b { display: block; font: 600 17px/1.3 var(--display); margin-bottom: 4px; }
.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  font: 500 16px/1.4 var(--body); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 12px; padding: 15px 16px; cursor: pointer;
}
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt .box { width: 20px; height: 20px; flex: none; border: 1.5px solid var(--muted); border-radius: 50%; display: grid; place-items: center; }
.multi .opt .box { border-radius: 5px; }
.opt[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent); }
.opt[aria-pressed="true"] .box::after { content: ""; width: 7px; height: 7px; background: var(--on-accent); border-radius: inherit; }
label { font-weight: 600; font-size: 15px; display: block; margin-bottom: 8px; }
label small { font-weight: 400; color: var(--muted); }
input[type=text], input[type=email], input[type=tel], input[type=url], textarea {
  width: 100%; font: 17px/1.45 var(--body); color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px;
}
::placeholder { color: var(--muted); opacity: .75; }
textarea { min-height: 160px; resize: vertical; }
input:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fields .full { grid-column: 1 / -1; }
.slider { display: flex; flex-direction: column; gap: 14px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.readout { display: flex; gap: 28px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.readout div { font: 700 38px/1 var(--display); }
.readout small { display: block; font: 500 12px/1.4 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btn {
  font: 600 16px/1 var(--body); border-radius: 12px; padding: 15px 22px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); text-decoration: none; display: inline-block;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.ghost { background: transparent; color: var(--muted); border-color: transparent; padding-inline: 4px; }
.err { color: var(--err); font-size: 15px; min-height: 1em; }
.fine { font-size: 14px; color: var(--muted); }
.ok { color: var(--good); font: 500 13px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
.stage { color: var(--accent); font: 500 13px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
.checklist { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.checklist li::before { content: "\2192  "; color: var(--accent); }
@media (max-width: 520px) {
  .card { padding: 22px; }
  .how, .fields { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <a class="brand" href="../" style="color:inherit;text-decoration:none"><svg viewBox="0 0 600 600" aria-hidden="true"><defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="570" y2="0"><stop offset="0" stop-color="#4f7bff"/><stop offset=".28" stop-color="#9a6cf0"/><stop offset=".45" stop-color="#ff6f6f"/><stop offset=".62" stop-color="#ffb347"/><stop offset=".78" stop-color="#7fd36b"/><stop offset="1" stop-color="#46c9d6"/></linearGradient><filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter><filter id="er"><feMorphology operator="erode" radius="9"/></filter><path id="hm" fill-rule="evenodd" d="M200 30h200a170 170 0 0 1 170 170v200a170 170 0 0 1-170 170H200A170 170 0 0 1 30 400V200A170 170 0 0 1 200 30ZM215 160a40 40 0 0 0-40 40v200a40 40 0 0 0 80 0v-65h90v65a40 40 0 0 0 80 0V200a40 40 0 0 0-80 0v65h-90v-65a40 40 0 0 0-40-40Z"/></defs><use href="#hm" fill="url(#lg)" filter="url(#bl)" opacity=".7"/><use href="#hm" fill="url(#lg)"/><use href="#hm" fill="#1b1b1b" filter="url(#er)"/></svg>Handoff</a>
    <span class="eyebrow" id="count"></span>
  </div>
  <div class="ticks" id="ticks" aria-hidden="true"></div>
  <section class="card" id="card" aria-live="polite"></section>
  <p class="fine">Your answers only go to the Handoff team building your assistant.</p>
</main>

<script>
const QUALIFIED = ['Under $500', '$500 to $1,500', '$1,500+'];  // under $500 fits the $375 founding deal
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyKjlOzj3mMTQH7h-Zfn9RVoqlbDA0ZaeIy0lXaEQxHMpAaohFVYHPN29nLZRv7vBtKjQ/exec';
const isQ = () => QUALIFIED.includes(answers.budget);
const BRIEF = 'Optional details';

// Short form first: 3 taps and contact details, then we have the lead.
// Everything after 'done' is optional extra detail, sent as a second email.
const STEPS = [
  { id: 'task', type: 'single', q: 'What eats most of your week?',
    opts: ['Answering customers and emails', 'Booking and filling empty slots', 'Chasing invoices and quotes', 'Posting on social media', 'Finding new leads or stores', 'Keeping up with competitors', 'Something else'],
    detail: 'Tell us more (optional)', detailPh: 'Replying to every new quote request within an hour' },
  { id: 'business', type: 'single', q: 'What best describes you?',
    opts: ['Solo / freelancer', 'Local service business (salon, studio, clinic, etc.)', 'Online store / ecommerce', 'B2B company (sales, distribution, manufacturing)', 'Agency or consultant', 'Creator or personal brand', 'Something else'] },
  { id: 'budget', type: 'single', q: 'What would you invest to get that time back?',
    opts: ['Just exploring for now', 'Under $500', '$500 to $1,500', '$1,500+'] },
  { id: 'contact', type: 'contact', q: 'Where should we reach you?' },
  { id: 'done' },

  { id: 'hours', type: 'range', when: isQ, stage: BRIEF, optional: true, q: 'Roughly how many hours a week does that task take?' },
  { id: 'tools', type: 'multi', when: isQ, stage: BRIEF, optional: true, q: 'Which tools do you use day to day?', hint: 'This tells us what your assistant can plug into.',
    opts: ['Gmail / Google Workspace', 'Outlook / Microsoft 365', 'Shopify', 'QuickBooks', 'A CRM (HubSpot, Salesforce, etc.)', 'Canva', 'Slack or Teams', 'Mostly paper and spreadsheets'],
    detail: 'Anything else? (optional)', detailPh: 'Jobber, ServiceTitan, Squarespace...' },
  { id: 'approval', type: 'single', when: isQ, stage: BRIEF, optional: true, q: 'How much should it do on its own?',
    opts: ['Draft everything for my OK first', 'Handle the simple ones, draft the rest for me', 'Run fully on its own'] },
  { id: 'steps', type: 'text', when: isQ, stage: BRIEF, optional: true, q: 'Walk us through how you do it today.',
    hint: 'Write it like instructions for a new hire. Numbered steps are perfect.',
    ph: '1. Open the quote request email\n2. Check the address is in our service area\n3. Pull our price sheet and pick the right package\n4. Reply with the price and 2 install dates' },
  { id: 'example', type: 'text', when: isQ, stage: BRIEF, optional: true, q: 'Show us what a great result looks like.',
    hint: 'Paste a real example you were happy with, or a share link to one. Swap out anything private.',
    ph: 'Hi Sarah, thanks for reaching out! For a 2,000 sq ft home our Comfort package is $8,400 installed...' },
  { id: 'rules', type: 'text', when: isQ, stage: BRIEF, optional: true, last: true, q: 'What should it never do?',
    hint: 'Pricing rules, tone of voice, anything that needs a human.',
    ph: 'Never quote under $6k. Anything commercial goes to me. Friendly, not salesy.' },
  { id: 'thanks' }
];

const answers = { tools: [] };
// Which ad or link sent them: ?ad=04 or utm tags on the link
const qs = new URLSearchParams(location.search);
answers.source = qs.get('ad') || qs.get('utm_content') || qs.get('utm_source') || (document.referrer ? new URL(document.referrer).hostname : 'direct');
let cur = 'task';

// Test copies on this computer never send real leads or step counts
const LOCAL = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
// Step counts: a random id for this visit, the step and the ad. No answers or contact details.
const VISIT = Math.random().toString(36).slice(2, 10);
const seen = new Set();
function track(id) {
  if (seen.has(id)) return;
  seen.add(id);
  if (LOCAL) return;
  try { navigator.sendBeacon(ENDPOINT, JSON.stringify({ event: 'step', visit: VISIT, step: id, source: answers.source })); } catch (e) {}
}

const card = document.getElementById('card');
const ticks = document.getElementById('ticks');
const count = document.getElementById('count');

const PITCH = '<h1>Tell us what eats your week. We\'ll build the AI that handles it, before you buy.</h1>' +
  '<p class="sub">Takes about a minute. No AI experience needed.</p>' +
  '<div class="deal"><b>Founding client deal</b><span><s>$750</s> $375 setup for the next 5 businesses.</span></div>';

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const visible = () => STEPS.filter(s => !s.when || s.when());
const step = () => STEPS.find(s => s.id === cur);

function progress() {
  const inDetails = !!step().stage || cur === 'thanks';
  const qs = visible().filter(s => s.type && !!s.stage === inDetails);
  const n = qs.findIndex(s => s.id === cur) + 1;
  const all = cur === 'done' || cur === 'thanks';
  const on = all ? qs.length : n;
  ticks.innerHTML = qs.map((s, k) => '<span' + (k < on ? ' class="on"' : '') + '></span>').join('');
  count.textContent = n ? (inDetails ? 'Detail ' : 'Question ') + n + ' of ' + qs.length : '';
}

function nav(ok, label) {
  if (step().last) label = 'Send details';
  return '<div class="nav">' +
    (cur !== 'task' ? '<button class="btn ghost" id="back" type="button">Back</button>' : '<span></span>') +
    '<button class="btn" id="next" type="button"' + (ok ? '' : ' disabled') + '>' + (label || 'Next') + '</button></div>';
}

function valid(s) {
  const v = answers[s.id];
  if (s.optional) return true;
  if (s.type === 'multi') return v.length > 0;
  if (s.type === 'single') return !!v;
  if (s.type === 'text') return (v || '').trim().length >= (s.min || 1);
  if (s.type === 'short') return (v || '').trim().length > 1;
  return true;
}

function heading(s) {
  return (s.stage ? '<span class="stage">' + s.stage + '</span>' : '') + '<h2>' + esc(s.q) + '</h2>' + (s.hint ? '<p class="sub">' + esc(s.hint) + '</p>' : '');
}

function detailField(s) {
  if (!s.detail) return '';
  return '<div><label for="f-' + s.id + '-detail">' + esc(s.detail) + '</label><input type="text" id="f-' + s.id + '-detail" placeholder="' + esc(s.detailPh || '') + '" value="' + esc(answers[s.id + '_detail'] || '') + '"></div>';
}

function render() {
  const s = step();
  progress();
  track(s.id);
  if (s.type === 'single' || s.type === 'multi') {
    const multi = s.type === 'multi';
    const sel = v => multi ? answers[s.id].includes(v) : answers[s.id] === v;
    card.innerHTML = (s.id === 'task' ? PITCH : '') + heading(s) +
      '<div class="options' + (multi ? ' multi' : '') + '">' +
      s.opts.map((o, k) => '<button class="opt" type="button" data-k="' + k + '" aria-pressed="' + sel(o) + '"><span class="box"></span>' + esc(o) + '</button>').join('') +
      '</div>' + detailField(s) + nav(valid(s));
    card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const v = s.opts[b.dataset.k];
      if (multi) {
        const a = answers[s.id];
        a.includes(v) ? a.splice(a.indexOf(v), 1) : a.push(v);
        render();
      } else {
        answers[s.id] = v;
        render();
        if (!s.detail && !s.last) setTimeout(go, 180);
      }
    });
    const d = document.getElementById('f-' + s.id + '-detail');
    if (d) d.oninput = () => { answers[s.id + '_detail'] = d.value; };
  } else if (s.type === 'text' || s.type === 'short') {
    const field = s.type === 'text'
      ? '<textarea id="f-field" maxlength="4000" placeholder="' + esc(s.ph || '') + '">' + esc(answers[s.id] || '') + '</textarea>'
      : '<input type="text" id="f-field" maxlength="500" placeholder="' + esc(s.ph || '') + '" value="' + esc(answers[s.id] || '') + '">';
    card.innerHTML = heading(s) + field + nav(valid(s));
    const t = document.getElementById('f-field');
    t.oninput = () => { answers[s.id] = t.value; document.getElementById('next').disabled = !valid(s); };
    t.onkeydown = e => { if (s.type === 'short' && e.key === 'Enter' && valid(s)) go(); };
    t.focus();
  } else if (s.type === 'range') {
    card.innerHTML = heading(s) + '<div class="slider">' +
      '<input type="range" id="f-hours" min="1" max="40" step="1" value="' + (answers.hours || 5) + '" aria-label="Hours per week">' +
      '<div class="readout"><div><span id="hw"></span><small>hours a week</small></div><div><span id="hy"></span><small>hours a year</small></div><div><span id="wd"></span><small>full work weeks a year</small></div></div>' +
      '</div>' + nav(true);
    const r = document.getElementById('f-hours');
    const show = () => {
      answers.hours = +r.value;
      document.getElementById('hw').textContent = r.value;
      document.getElementById('hy').textContent = (r.value * 50).toLocaleString();
      document.getElementById('wd').textContent = (r.value * 50 / 40).toFixed(1);
    };
    r.oninput = show; show();
  } else if (s.type === 'contact') {
    const v = k => esc(answers[k] || '');
    card.innerHTML = '<h2>' + esc(s.q) + '</h2><p class="sub">We\'ll reach out to set up your demo.</p>' +
      '<div class="fields">' +
      '<div><label for="f-name">Your name</label><input type="text" id="f-name" autocomplete="name" value="' + v('name') + '"></div>' +
      '<div><label for="f-email">Email</label><input type="email" id="f-email" autocomplete="email" value="' + v('email') + '"></div>' +
      '<div><label for="f-phone">Phone <small>(optional)</small></label><input type="tel" id="f-phone" autocomplete="tel" value="' + v('phone') + '"></div>' +
      '<div><label for="f-website">Website or Instagram <small>(optional)</small></label><input type="text" id="f-website" value="' + v('website') + '"></div>' +
      '</div><p class="err" id="err"></p>' + nav(true, 'Send');
    ['name', 'email', 'phone', 'website'].forEach(k => {
      const el = document.getElementById('f-' + k);
      el.oninput = () => { answers[k] = el.value.trim(); };
    });
  } else if (s.id === 'done') {
    const r = answers.result || {};
    const first = esc((answers.name || '').split(' ')[0]);
    const got = '<span class="ok">Got it' + (first ? ', ' + first : '') + '</span>';
    card.innerHTML = r.qualified
      ? got + '<h2>Pick a time for your demo.</h2>' +
        '<p class="sub">Grab a 30 minute slot and we\'ll show you how it works on your business.</p>' +
        '<div><a class="btn" href="' + esc(r.bookingUrl || '#') + '" target="_blank" rel="noopener">Pick a time</a></div>' +
        '<p class="sub">Want it closer to real on the call? Give us a few details. About 3 minutes, all optional.</p>' +
        '<div class="nav"><span></span><button class="btn ghost" id="next" type="button">Add details</button></div>'
      : got + '<h2>Thanks. We\'ll email you within 24 hours.</h2>' +
        '<p class="sub">We\'ll send a couple of simple ways to start using AI on the task you described, free. If it clicks, we can build the full version later.</p>';
  } else if (s.id === 'thanks') {
    const r = answers.result || {};
    card.innerHTML = '<span class="ok">Thank you</span><h2>That gives us what we need.</h2>' +
      '<p class="sub">If you haven\'t yet, pick a time for your demo.</p>' +
      '<div><a class="btn" href="' + esc(r.bookingUrl || '#') + '" target="_blank" rel="noopener">Pick a time</a></div>';
  }
  const next = document.getElementById('next');
  const back = document.getElementById('back');
  if (next) next.onclick = s.type === 'contact' ? submit : s.last ? sendDetails : go;
  if (back) back.onclick = () => move(-1);
}

function move(d) {
  const vis = visible();
  const k = vis.findIndex(s => s.id === cur) + d;
  if (k >= 0 && k < vis.length) { cur = vis[k].id; render(); window.scrollTo(0, 0); }
}
function go() { move(1); }

// The sheet has no column for the task detail, so it travels inside the task answer
function payload() {
  const p = Object.assign({}, answers);
  delete p.result;
  if (p.task_detail) p.task = p.task + ': ' + p.task_detail;
  return p;
}

function send(p, done, fail) {
  if (LOCAL) return setTimeout(() => done({ qualified: isQ(), bookingUrl: '#' }), 400);
  // Plain text body keeps this a simple request, so no Google sign-in or CORS preflight is involved
  fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(p) })
    .then(r => r.json()).then(j => j.ok ? done(j.result) : fail()).catch(fail);
}

function submit() {
  const err = document.getElementById('err');
  const next = document.getElementById('next');
  if (!answers.name) return err.textContent = 'Add your name so we know who we\'re talking to.';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(answers.email || '')) return err.textContent = 'That email doesn\'t look right. Check it and try again.';
  err.textContent = '';
  next.disabled = true; next.textContent = 'Sending...';
  send(payload(), res => { answers.result = res; go(); }, () => {
    next.disabled = false; next.textContent = 'Send';
    err.textContent = 'Something went wrong sending your answers. Try again in a moment.';
  });
}

// The optional details arrive as a second row and email, marked so they're easy to spot
function sendDetails() {
  const next = document.getElementById('next');
  const filled = answers.tools.length || answers.approval || answers.steps || answers.example || answers.rules;
  if (!filled) return go();
  next.disabled = true; next.textContent = 'Sending...';
  const p = payload();
  p.source = answers.source + ' (details)';
  send(p, () => go(), () => { next.disabled = false; next.textContent = 'Try again'; });
}

render();
</script>
</body>
</html>
