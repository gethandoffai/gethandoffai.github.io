<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo for Harveys On Beverly</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#24130c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Gloock&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{--deep:#1d0f09;--walnut:#3a2116;--brass:#e3ad4d;--ivory:#f8ecd4;--ink:#2a1810;--soft:#e2c9a3;
  --display:'Gloock',Georgia,serif;--body:'Karla',system-ui,sans-serif;--hand:'Caveat',cursive;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ivory);font:16px/1.45 var(--body);background:var(--walnut);background-image:radial-gradient(110% 620px at 50% 40%,#7d4527 0,#0000 72%);background-attachment:fixed;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,.feed:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.label{background:var(--deep);color:#f0d9ae;text-align:center;font-weight:600;font-size:13px;line-height:1.35;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;text-wrap:balance;border-bottom:2px solid var(--brass);position:sticky;top:0;z-index:20}
#app{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:1040px;margin:0 auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));gap:12px}
.say{text-align:center;width:100%}
h1{font:400 clamp(32px,9vw,40px)/1.04 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.say p{margin:6px 0 0;color:#f3dfbd;font-size:17px;line-height:1.35;text-wrap:balance}
.act{position:relative;z-index:2;width:100%;max-width:360px;text-align:center}
.go{display:block;width:100%;border:0;border-radius:16px;background:var(--brass);color:#2a1505;font-weight:700;font-size:19px;min-height:58px;padding:15px 18px;text-decoration:none;box-shadow:0 5px 0 #96671f;transition:transform .1s,box-shadow .1s}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #96671f}
.fine{font-size:13px;line-height:1.4;color:var(--soft);margin:10px 0 0;text-wrap:balance}
.lnk{background:none;border:0;color:#f3dfbd;text-decoration:underline;text-underline-offset:3px;padding:10px 8px;min-height:44px;font-size:15px}
/* phone */
.phone{position:relative;flex:1 1 auto;width:100%;max-width:350px;min-height:400px;background:#0d0806;border-radius:34px;padding:8px;box-shadow:0 0 0 2px #6d4a33,0 26px 60px #0d0603b8;display:flex}
.phone.sm{min-height:250px}
.glass{position:relative;flex:1;min-width:0;border-radius:27px;overflow:hidden;background:#14100d;display:flex;flex-direction:column;isolation:isolate}
.in{animation:in .42s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{transform:translateY(16px)}}
svg.sc{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 1 camera */
.view{position:relative;flex:1;overflow:hidden}
.view i{position:absolute;width:34px;height:34px;border:3px solid #ffdf8e;z-index:2}
.view i:nth-of-type(1){left:7%;top:42%;border-right:0;border-bottom:0}.view i:nth-of-type(2){right:7%;top:42%;border-left:0;border-bottom:0}.view i:nth-of-type(3){left:7%;bottom:18%;border-right:0;border-top:0}.view i:nth-of-type(4){right:7%;bottom:18%;border-left:0;border-top:0}
.cam{background:#0d0806;padding:14px 12px 16px;text-align:center}
.shut{width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:#0d0806;padding:5px;position:relative}
.shut:before{content:"";display:block;width:100%;height:100%;border-radius:50%;background:var(--brass);transition:transform .12s}
.shut:active:before{transform:scale(.86)}
.shut:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--brass);animation:ping 1.8s ease-out infinite}@keyframes ping{to{transform:scale(1.45);opacity:0}}
.cam b{display:block;font-size:17px;margin-top:8px}
.flash{position:absolute;inset:0;background:#fff;z-index:9;animation:fl .5s ease-out forwards;pointer-events:none}@keyframes fl{to{opacity:0}}
.fan{position:absolute;inset:0;z-index:8;background:#1d0f09}
.fan span{position:absolute;left:50%;top:46%;width:46%;aspect-ratio:4/5;margin:-29% 0 0 -23%;border:6px solid #fff6e3;border-radius:8px;overflow:hidden;box-shadow:0 10px 24px #0009;animation:fan .9s .35s cubic-bezier(.2,.9,.25,1) both}
@keyframes fan{from{transform:none}to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.82)}}
.fan b{position:absolute;left:0;right:0;bottom:9%;text-align:center;font:400 25px/1.1 var(--display)}
/* post */
.feed{flex:1;min-height:0;display:flex;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;background:#fffaf0;color:var(--ink)}
.who{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:14px;line-height:1.15}
.who i{width:32px;height:32px;border-radius:50%;background:#24514d;color:#ffe3a1;font:400 18px/32px var(--display);text-align:center;flex:none}
.who b{display:block;font-size:14.5px}.who span{flex:1;min-width:0;color:#6d5544}.who em{font-style:normal;font-weight:700;font-size:13px;background:#f0dcb3;color:#5f3c10;border-radius:6px;padding:4px 8px}
.pic{position:relative;flex:1;min-height:230px;overflow:hidden;color:#fff;background:#222}
.cap{margin:0;padding:11px 14px 14px;font-size:15.5px;line-height:1.36;min-height:90px}.cap b{margin-right:5px}
.hook{position:absolute;z-index:3;left:18px;right:18px;top:15px;font:400 clamp(32px,9.4vw,40px)/1 var(--display);margin:0;pointer-events:none;text-wrap:balance}
.dots{position:absolute;z-index:4;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.pips{display:flex;justify-content:center;gap:7px;padding:0 0 10px;background:#fffaf0}.pips i{width:8px;height:8px;border-radius:50%;background:#d9c4a0;transition:.2s}.pips i.on{background:#a14d24;width:22px;border-radius:6px}
.arr{display:none}
/* guess */
.opts{position:absolute;z-index:4;left:14px;right:14px;bottom:14px;display:flex;gap:8px}
.opts button{flex:1;border:0;border-radius:12px;min-height:50px;background:#fff3d6;color:#3a1408;font:400 21px/1 var(--display);box-shadow:0 4px 0 #3a14084d}
.opts button.yes{background:#ffce4f;flex:2.2}.opts button.no{opacity:.4;text-decoration:line-through}
/* vote */
.vote{position:absolute;inset:0;display:flex;flex-direction:column}
.vote button{position:relative;flex:1 1 0;border:0;padding:0;overflow:hidden;transition:flex-grow .45s cubic-bezier(.2,.8,.2,1),filter .3s;color:#fff;background:#1c2d4a}.vote button+button{background:#a8461f}
.vote button span{position:absolute;z-index:2;left:14px;bottom:11px;background:#1d0f09;border-radius:9px;padding:7px 12px;font-weight:700;font-size:16px}
.vote.v0 button:first-of-type,.vote.v1 button:last-of-type{flex-grow:2}.vote.v0 button:last-of-type,.vote.v1 button:first-of-type{filter:brightness(.5) saturate(.6)}
.vote .or{position:absolute;z-index:3;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#ffce4f;color:#3a1408;font:400 23px/52px var(--display);text-align:center;pointer-events:none}.vote.v0 .or,.vote.v1 .or{display:none}
/* yes */
.stamp{position:absolute;z-index:6;left:50%;top:44%;font:400 96px/1 var(--display);color:#fff;background:#5f6c25;border:6px solid #fff;border-radius:18px;padding:10px 26px 18px;animation:st .34s cubic-bezier(.2,1.6,.4,1) both}@keyframes st{from{transform:translate(-50%,-50%) rotate(-9deg) scale(2);opacity:0}to{transform:translate(-50%,-50%) rotate(-9deg)}}
.week{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.55fr 1fr 1fr;gap:8px;padding:10px;background:#fffaf0}
.week>div{position:relative;border-radius:12px;overflow:hidden;min-height:96px;background:#222}.week>div:first-child{grid-column:1/-1}
.week b{position:absolute;z-index:5;left:8px;bottom:8px;background:#5f6c25;color:#fff;border-radius:8px;padding:4px 9px;font-size:14px}
.week .hook,.week .opts,.week .vote span,.week .or{display:none}.week .vote button{pointer-events:none}
/* listing */
dialog{border:0;padding:0;border-radius:18px;background:#fff6e3;color:var(--ink);width:min(520px,calc(100% - 32px));max-height:86vh;max-height:86dvh;color-scheme:light}dialog::backdrop{background:#140a06c9}
.lst{padding:22px 20px}.lst h2{outline:0;font:400 25px/1.14 var(--display);margin:0 0 10px}.lst p{margin:0 0 12px}.lst dl{margin:0 0 14px}.lst dl div{display:grid;grid-template-columns:106px 1fr;gap:10px;padding:7px 0;border-top:1px solid #e2cda6}.lst dt{color:#6d5544}.lst dd{margin:0;font-weight:600}.lst dd.b{color:#a8431f}.lst .go{box-shadow:none;background:#24514d;color:#fff}
/* motion: only the post on screen moves */
.card:not(.live) .pic *,.week *{animation-play-state:paused!important;animation:none!important}
.spin{transform-origin:200px 262px;animation:spin 3.2s linear infinite}.spin2{transform-origin:196px 282px;animation:spin 2.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ray{transform-origin:200px 262px;animation:spin 46s linear infinite}
.cut>g{opacity:0}.cut>g:first-child{opacity:1}
.live .cut>g{opacity:0;animation:cut 6s steps(1,end) infinite}.live .cut>g:nth-child(2){animation-delay:2s}.live .cut>g:nth-child(3){animation-delay:4s}
@keyframes cut{0%{opacity:1}33.33%,100%{opacity:0}}
.push{transform-origin:200px 250px;animation:push 2s linear infinite}@keyframes push{from{transform:none}to{transform:scale(1.07)}}
.pull{transform-origin:200px 250px;animation:pull 2s linear infinite}@keyframes pull{from{transform:scale(1.09) translateX(-8px)}to{transform:none}}
.slats{mix-blend-mode:screen;animation:slats 6s ease-in-out infinite alternate}@keyframes slats{from{transform:translate(50px,-14px)}to{transform:translate(-70px,22px)}}
.sun{animation:sun 6s linear infinite}@keyframes sun{to{transform:translateY(74px)}}
.edge{stroke-dasharray:.28 1.4;animation:edge 2s cubic-bezier(.5,0,.3,1) infinite}@keyframes edge{from{stroke-dashoffset:.28}to{stroke-dashoffset:-1.1}}
.glo{animation:glo 2.6s ease-in-out infinite alternate}@keyframes glo{from{opacity:.55}to{opacity:1}}
.sway{transform-origin:200px -40px;animation:sway 3.4s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.pen path{stroke-dasharray:1}.live .pen path{animation:pen 7s linear infinite}@keyframes pen{0%{stroke-dashoffset:1}32%,100%{stroke-dashoffset:0}}
.live .ink{animation:ink 7s linear infinite}@keyframes ink{0%,36%{opacity:0}48%,100%{opacity:1}}
.live .wd{animation:wd 7s linear infinite}@keyframes wd{0%,52%{opacity:0}58%,100%{opacity:1}}
.beam{animation:beam 3.4s ease-in-out infinite alternate}@keyframes beam{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
@media(min-width:860px){
  #app{display:grid;grid-template:1fr auto auto 1fr/1fr 390px;grid-template-areas:". ph" "say ph" "act ph" ". ph";column-gap:72px;row-gap:26px;padding:26px 32px}
  .say{grid-area:say;text-align:left}.act{grid-area:act;text-align:left}.phone{grid-area:ph;max-width:none;height:min(740px,calc(100vh - 100px));align-self:center}
  h1{font-size:68px}.say p{font-size:21px;max-width:32ch;margin-top:14px}.fine{font-size:14px;max-width:44ch;margin-top:18px}.go{text-align:center}.lnk{padding-left:0}
  .hook{font-size:42px}
  .arr{display:block;position:absolute;z-index:6;top:46%;width:48px;height:48px;border-radius:50%;border:0;background:#f8ecd4;color:#2a1505;font-size:24px;line-height:1}.arr.l{left:-24px}.arr.r{right:-24px}.arr:disabled{opacity:0;pointer-events:none}
}
@media(max-width:859px) and (max-height:640px){.say p{font-size:15px;margin-top:3px}h1{font-size:29px}#app{gap:8px;padding-top:9px}.cam{padding:8px 10px 10px}.shut{width:68px;height:68px}.phone{min-height:370px}.phone.sm{min-height:250px}.week>div{min-height:60px}.cap{font-size:14.5px;padding:8px 12px 10px;min-height:56px}.pic{min-height:190px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.stamp{transform:translate(-50%,-50%) rotate(-9deg)}.fan span{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.82)}}
</style></head>
<body>
<div class="label">Demo made for Harveys On Beverly by Brady at Handoff. Not their site.</div>
<main id="app"></main>
<dialog id="dlg" aria-label="The listing"></dialog>

<!-- Drawings made for this demo. No photo of theirs is on this page. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b3a983"/><stop offset="1" stop-color="#7c7357"/></linearGradient>
  <linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8d8368"/><stop offset="1" stop-color="#5e5543"/></linearGradient>
  <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ada27c"/><stop offset=".5" stop-color="#8f8565"/><stop offset="1" stop-color="#6a614a"/></linearGradient>
  <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7f765a"/><stop offset="1" stop-color="#6a624a"/></linearGradient>
  <linearGradient id="gA" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8a8163"/><stop offset="1" stop-color="#6b624b"/></linearGradient>

  <pattern id="tw" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 1h1.6M4 2.600h1.400M2 4.600h1.500M5.400 6h1.300" stroke="#d8cda6" stroke-width=".8" opacity=".5"/><path d="M1.500 3h1.400M5 .8h1.300M.4 5.800h1.400M4 4.400h1.200" stroke="#3d3726" stroke-width=".8" opacity=".5"/></pattern>
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7a2f55"/><stop offset=".5" stop-color="#f0713a"/><stop offset="1" stop-color="#ffd36b"/></linearGradient>
  <linearGradient id="gWall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4562c"/><stop offset="1" stop-color="#5d2036"/></linearGradient>
  <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2a4d"/><stop offset="1" stop-color="#33223f"/></linearGradient>
  <radialGradient id="gGlow"><stop stop-color="#ffe7a8"/><stop offset=".35" stop-color="#ffc861" stop-opacity=".55"/><stop offset="1" stop-color="#ffb13d" stop-opacity="0"/></radialGradient>
  <radialGradient id="gSpot" cx=".4" cy=".3" r=".8"><stop stop-color="#6b4527"/><stop offset=".55" stop-color="#2b1a10"/><stop offset="1" stop-color="#0e0805"/></radialGradient>
  <radialGradient id="gVig" cx=".42" cy=".36" r=".78"><stop offset=".3" stop-color="#0e0805" stop-opacity="0"/><stop offset="1" stop-color="#0e0805" stop-opacity=".9"/></radialGradient>
  <linearGradient id="gBeam"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#ffe9bd" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gLight"><stop stop-color="#ff9c3f" stop-opacity="0"/><stop offset=".22" stop-color="#ffa64a" stop-opacity=".85"/><stop offset=".75" stop-color="#ff8d35" stop-opacity=".75"/><stop offset="1" stop-color="#ff8d35" stop-opacity="0"/></linearGradient>
  <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#120805" stop-opacity=".75"/><stop offset="1" stop-color="#120805" stop-opacity="0"/></linearGradient>
  <g id="arm"><path d="M12 129Q52 117 92 121q24 4 26 42l-60 18z" fill="url(#gA)"/><path d="M12 129q20-5 37 2l7 128H30Q18 200 12 129z" fill="url(#gF)"/><path d="M12 129Q52 117 92 121q24 4 26 42l-60 18z M12 129q20-5 37 2l7 128H30Q18 200 12 129z" fill="url(#tw)"/><path d="M12 129q20-5 37 2l7 128" fill="none" stroke="#4c4533" stroke-width="2.500"/></g>
  <symbol id="sofa" viewBox="0 0 780 345">
    <ellipse cx="390" cy="336" rx="350" ry="8" fill="#0b0503" opacity=".45"/>
    <path d="M76 258h16l-1 74q-5 5-10 0z" fill="url(#gW)"/><path d="M688 258h16l-5 74q-5 5-10 0z" fill="url(#gW)"/><path d="M84 258h612v13H84z" fill="url(#gW)"/><path d="M84 259h612" stroke="#e0ac6d" stroke-width="2"/>
    <path d="M103 17Q178 31 262 31H518Q602 31 672 15Q678 72 690 122V172H88V124Q102 72 103 17z" fill="url(#gB)"/><path d="M103 17Q178 31 262 31H518Q602 31 672 15Q678 72 690 122V172H88V124Q102 72 103 17z" fill="url(#tw)"/>
    <path d="M103 17Q178 31 262 31H518Q602 31 672 15" fill="none" stroke="#d0c69e" stroke-width="3.500" stroke-linecap="round"/>
    <path d="M148 166C150 112 162 84 204 83H596C622 84 632 116 634 166z" fill="url(#gP)"/><path d="M148 166C150 112 162 84 204 83H596C622 84 632 116 634 166z" fill="url(#tw)"/><path d="M148 166C150 112 162 84 204 83H596C622 84 632 116 634 166" fill="none" stroke="#473f2f" stroke-width="2.500"/>
    <use href="#arm"/><use href="#arm" transform="matrix(-1 0 0 1 780 0)"/>
    <path d="M54 216h672v43H54z" fill="url(#gF)"/><path d="M54 216h672v43H54z" fill="url(#tw)"/>
    <path d="M52 184q4-18 40-20h596q36 2 40 20v22q0 14-16 14H68q-16 0-16-14z" fill="url(#gS)"/><path d="M52 184q4-18 40-20h596q36 2 40 20v22q0 14-16 14H68q-16 0-16-14z" fill="url(#tw)"/>
    <path d="M58 178q8-11 36-11h592q28 0 36 11" fill="none" stroke="#cbc097" stroke-width="2" opacity=".8"/><path d="M52 206q0 14 16 14h644q16 0 16-14" fill="none" stroke="#3f3828" stroke-width="3"/>
  </symbol>
  <symbol id="rattan" viewBox="0 0 120 160"><path d="M60 6C18 6 12 60 26 96h68C108 60 102 6 60 6z" fill="#c9904a"/><path d="M60 6v90M42 10q-8 40-2 86M78 10q8 40 2 86M20 40q40 14 80 0M20 66q40 14 80 0" stroke="#8a5726" stroke-width="3" fill="none"/><ellipse cx="60" cy="102" rx="44" ry="13" fill="#e8d3a6"/><path d="M28 110l-8 44M92 110l8 44M50 114l-3 42M70 114l3 42" stroke="#a36c33" stroke-width="6"/></symbol>

  <symbol id="glows" viewBox="0 0 768 530" overflow="visible"><circle cx="68" cy="267" r="150" fill="url(#gGlow)"/><circle cx="697" cy="276" r="150" fill="url(#gGlow)"/><circle cx="230" cy="204" r="120" fill="url(#gGlow)"/><circle cx="487" cy="211" r="120" fill="url(#gGlow)"/><circle cx="200" cy="377" r="190" fill="url(#gGlow)"/><circle cx="614" cy="381" r="190" fill="url(#gGlow)"/></symbol>
  <symbol id="lamp" viewBox="0 0 768 530" overflow="visible"></symbol>
</defs></svg>
<script>
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
// The chandelier: three-tier frosted shades with clear cut-outs, chrome arms, rosewood center.
const shade = (cx, by, w, h) => { const t = h / 3, L = cx - w / 2, R = cx + w / 2; let o = `<rect x="${cx - w * .22}" y="${by - 3}" width="${w * .44}" height="${h * .06}" rx="2" fill="#b9bec0"/>`;
  for (let i = 0; i < 3; i++) { const y = by - h + i * t; o += `<path d="M${L + w * .07} ${y}L${L} ${y + t * .34}v${t * .34}L${L + w * .07} ${y + t}H${R - w * .07}L${R} ${y + t * .68}v${-t * .34}L${R - w * .07} ${y}z" fill="#f9f3e2" stroke="#cbc4b2" stroke-width="2"/>`;
    for (let j = 0; j < 4; j++) { const x = L + w * (.17 + j * .22), m = y + t * .52; o += `<path d="M${x - w * .085} ${m}L${x} ${m - t * .24}L${x + w * .085} ${m}L${x} ${m + t * .24}z" fill="#b7c4c2"/>`; } }
  return o + `<ellipse cx="${cx}" cy="${by - h}" rx="${w * .42}" ry="${w * .1}" fill="#dcd9cb" stroke="#f6f2e6" stroke-width="3"/>`; };
const rod = (a, b, c, d, w) => `<path d="M${a} ${b}L${c} ${d}" stroke="#59616a" stroke-width="${w + 4}"/><path d="M${a} ${b - 2}L${c} ${d - 2}" stroke="#d5dadd" stroke-width="${w}"/>`;
$('#lamp').innerHTML = `<path d="M372-400v662" stroke="#8d949a" stroke-width="9"/><path d="M370-400v662" stroke="#e1e4e6" stroke-width="4"/>${rod(350, 345, 236, 276, 9)}${rod(394, 345, 490, 284, 9)}${shade(230, 268, 90, 128)}${shade(487, 276, 92, 130)}${rod(340, 356, 16, 360, 10)}${rod(404, 356, 744, 368, 10)}${shade(68, 350, 110, 166)}${shade(697, 360, 118, 168)}<path d="M333 260h79v88h-79z" fill="#8a4a30"/><path d="M349 260v88M368 260v88M392 260v88" stroke="#5f2f1e" stroke-width="3" opacity=".7"/><ellipse cx="372.500" cy="260" rx="39.500" ry="10" fill="#a45d3e"/><path d="M333 346h79v28h-79z" fill="#c9ced1"/><path d="M333 372h79v22q-40 14-79 0z" fill="#7a3f28"/>${rod(352, 366, 172, 512, 11)}${rod(394, 366, 640, 512, 11)}${shade(200, 486, 148, 218)}${shade(614, 490, 160, 218)}`;

const svg = (b, par) => `<svg class="sc" viewBox="0 0 400 500" preserveAspectRatio="${par || 'xMidYMid'} slice" aria-hidden="true">${b}</svg>`;
const use = (id, x, y, w, h, more) => `<use href="#${id}" x="${x}" y="${y}" width="${w}" height="${h}" ${more || ''}/>`;
const sofa = (x, y, w, more) => use('sofa', x, y, w, w * 345 / 780, more);

// Light through the blinds: one patch of thin slats thrown across the wall and the sofa.
const slats = (x, y, n, o) => `<g class="slats" style="opacity:${o}"><g transform="translate(${x} ${y}) skewY(-9)">${Array.from({length:n}, (_, i) => `<rect x="${-i * 7}" y="${i * 25}" width="330" height="14" fill="url(#gLight)"/>`).join('')}</g></g>`;

const SHOP = () => svg(`<rect width="400" height="500" fill="#6f5a46"/><g fill="#57452f"><path d="M0 60h400v9H0zM0 190h400v9H0z"/><path d="M30 60h8v300h-8zM362 60h8v300h-8z"/></g>
  <g opacity=".8">${use('rattan', 46, 96, 72, 96)}${use('rattan', 288, 94, 74, 98)}<path d="M150 190v-30h34v30zM196 190l8-60h22l8 60z" fill="#3d5a52"/><path d="M150 60V36h60v24zM70 60c0-26 34-26 34 0zM270 60V30h14v30zM296 60V40h40v20z" fill="#8c4c2c"/></g>
  <path d="M0 356h400v144H0z" fill="#9a8468"/><path d="M0 356h400" stroke="#4c3a29" stroke-width="4"/><path d="M0 430h400M120 356l-70 144M290 356l70 144" stroke="#83705a" stroke-width="2"/>
  <ellipse cx="200" cy="300" rx="260" ry="150" fill="url(#gGlow)" opacity=".28"/>${sofa(44, 250, 312)}`);

const S = [
  // Mon: a record rising behind the sofa like a sun
  () => svg(`<rect width="400" height="500" fill="#0f4a4a"/><g class="ray" opacity=".9">${Array.from({length:14}, (_, i) => `<path d="M200 262L${200 + 560 * Math.cos(i * .4488)} ${262 + 560 * Math.sin(i * .4488)}L${200 + 560 * Math.cos(i * .4488 + .2244)} ${262 + 560 * Math.sin(i * .4488 + .2244)}z" fill="#146260"/>`).join('')}</g>
    <g class="spin">${use('disc', 48, 110, 304, 304)}<circle cx="200" cy="262" r="62" fill="#f0712f"/><path d="M200 200a62 62 0 0 1 62 62h-62z" fill="#ffb13d"/></g><circle cx="200" cy="262" r="6" fill="#15100f"/>
    <path d="M0 404h400v96H0z" fill="#c4562c"/><path d="M0 404h400v7H0z" fill="#e88347"/>${sofa(22, 264, 356)}`, 'xMidYMax'),
  // Tue: the room, three cuts
  () => svg(`<g class="cut"><g><g class="push"><rect x="-20" y="-20" width="440" height="430" fill="url(#gWall)"/><rect x="176" y="92" width="186" height="168" fill="url(#gSky)"/><circle class="sun" cx="272" cy="150" r="36" fill="#fff0b8"/>${Array.from({length:12}, (_, i) => `<path d="M176 ${97 + i * 14}h186v5H176z" fill="#3a1420"/>`).join('')}<path d="M172 88h194v176H172z" fill="none" stroke="#3a1420" stroke-width="9"/>
    <path d="M-20 396h440v130H-20z" fill="#40182a"/><path d="M-10 452q210-34 420 0v50H-10z" fill="#8c3327"/>${sofa(20, 268, 360)}${slats(30, 282, 7, .6)}</g></g>
    <g><g class="pull"><rect x="-20" y="-20" width="440" height="540" fill="#7a431f"/><path d="M-20 90h440M-20 210h440M-20 340h440M-20 450h440" stroke="#5f3115" stroke-width="3"/><rect x="18" y="104" width="366" height="366" rx="22" fill="#2b1a12"/><circle cx="196" cy="282" r="168" fill="#0c0807"/><g class="spin2">${use('disc', 34, 120, 324, 324)}<circle cx="196" cy="282" r="54" fill="#e8d3a6"/><path d="M196 228a54 54 0 0 1 54 54h-54z" fill="#c4562c"/></g><circle cx="196" cy="282" r="6" fill="#d5dadd"/><path d="M358 128L340 262l-64 78" fill="none" stroke="#d5dadd" stroke-width="9" stroke-linejoin="round"/><circle cx="358" cy="128" r="19" fill="#9da3a6"/><path d="M286 324l-22 28 14 11 20-26z" fill="#f3eee2"/>${slats(60, 110, 16, .42)}</g></g>
    <g><g class="push"><rect x="-20" y="-20" width="440" height="430" fill="url(#gNight)"/><rect x="-20" y="396" width="440" height="130" fill="#1d1228"/><path d="M-10 452q210-34 420 0v50H-10z" fill="#4a2a36"/><ellipse cx="200" cy="330" rx="230" ry="120" fill="url(#gGlow)" opacity=".5"/>${sofa(20, 268, 360)}<g class="glo">${use('glows', 70, 96, 260, 180)}</g>${lamp(70, 96, 260)}<g class="glo" style="mix-blend-mode:screen">${use('glows', 70, 96, 260, 180)}</g><path d="M-20 250h440v170H-20z" fill="#ffb347" opacity=".14"/></g></g></g><path d="M0 0h400v140H0z" fill="url(#gTop)"/>`),
  // Wed: one detail, three close cuts
  () => svg(`<g class="cut"><g><rect width="400" height="500" fill="url(#gSpot)"/><g class="push">${sofa(-150, 130, 1500)}<path class="edge" pathLength="1" transform="translate(-150 130) scale(1.923)" d="M88 124Q102 72 103 17Q178 31 262 31" fill="none" stroke="#fff1c4" stroke-width="3.500" stroke-linecap="round"/></g><rect width="400" height="500" fill="url(#gVig)"/></g>
    <g><rect width="400" height="500" fill="url(#gSpot)"/><g class="pull">${sofa(-1390, 120, 1900)}<path class="edge" pathLength="1" transform="translate(-1390 120) scale(2.436)" d="M518 31Q602 31 672 15Q678 72 690 122" fill="none" stroke="#fff1c4" stroke-width="3" stroke-linecap="round"/></g><rect width="400" height="500" fill="url(#gVig)"/></g>
    <g><rect width="400" height="500" fill="#2a1a10"/><path d="M0 396h400v104H0z" fill="#43301f"/><g class="push">${sofa(-120, -590, 2400)}<path class="edge" pathLength="1" d="M122 214h420" stroke="#ffdf9e" stroke-width="5"/></g><rect width="400" height="500" fill="url(#gVig)"/></g></g><path d="M0 0h400v150H0z" fill="url(#gTop)"/>`),
  // Thu: the design draws itself
  () => svg(`<rect width="400" height="500" fill="#f4e6c6"/><path d="${Array.from({length:21}, (_, i) => `M${i * 20} 0v500`).join('')}${Array.from({length:26}, (_, i) => `M0 ${i * 20}h400`).join('')}" stroke="#7fa3a3" stroke-width=".7" opacity=".45"/>
    <g class="ink">${sofa(15, 226, 370)}</g><g class="pen" transform="translate(15 226) scale(.4744)" fill="none" stroke="#24405e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${['M88 124Q102 72 103 17Q178 31 262 31H518Q602 31 672 15Q678 72 690 122','M148 166C150 112 162 84 204 83H596C622 84 632 116 634 166','M12 129Q52 117 92 121q24 4 26 42M12 129q6 74 18 130h26M49 131l7 128','M768 129Q728 117 688 121q-24 4-26 42M768 129q-6 74-18 130h-26M731 131l-7 128','M52 184q4-18 40-20h596q36 2 40 20v22q0 14-16 14H68q-16 0-16-14z','M54 220v39h672v-39M84 271h612','M76 259l5 75h10l1-63M704 259l-5 75h-10l-1-63'].map(d => `<path pathLength="1" d="${d}"/>`).join('')}</g>
    <g class="wd" fill="none" stroke="#a8431f" stroke-width="2.500" stroke-linecap="round"><path d="M92 200q-22 4-30 22M60 212l2 12 11-5M308 200q18 4 24 20M323 214l10 8 3-12M222 418q-28 4-52-38M170 392v-13l12 5"/></g>
    <g class="wd" fill="#a8431f" font-family="Caveat,cursive" font-weight="600" font-size="27"><text x="96" y="204">a wing</text><text x="236" y="204">a wing</text><text x="228" y="425">walnut</text></g>`),
  // Fri: pick one
  i => { const v = st.vote; return `<div class="vote ${v == null ? '' : 'v' + v}"><button data-vote="0" aria-label="Pick the chandelier"><svg class="sc" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="250" fill="#1c2d4a"/><g class="sway"><g class="glo">${use('glows', 70, 50, 260, 180)}</g>${lamp(70, 50, 260)}<g class="glo" style="mix-blend-mode:screen">${use('glows', 70, 50, 260, 180)}</g></g></svg><span>${v === 0 ? 'You picked the sputnik' : 'The sputnik'}</span></button><button data-vote="1" aria-label="Pick the sofa"><svg class="sc" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="250" fill="#b24a20"/><path d="M0 178h400v72H0z" fill="#7d2d18"/><g class="beam"><path d="M120 0h160l90 250H30z" fill="url(#gBeam)" opacity=".55"/></g>${sofa(42, 62, 316)}</svg><span>${v === 1 ? 'You picked the sofa' : 'The sofa'}</span></button><div class="or">or</div></div>`; },
];
// Words written ahead of time. Facts come only from Harveys On Beverly's own public pages.
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const HOOK = ['Guess the year.','Golden hour lives here.','Look at that wing.','Designed by Lawrence Peabody.',''];
const DARK = [0,0,0,1,0];
const CAP = [
  'No peeking. What year is this sofa from?',
  'Sun through the blinds, a record on, nowhere to be. That\'s the room this sofa wants.',
  'Follow the edge all the way up. Then look down: walnut.',
  'Peabody designed it for Nemschoff. This one is from 1960, with a walnut frame and a back that turns into wings.',
  'Warehouse of Wonders problem: you only get to take one home. Which one?',
];
const st = { s:0, i:0, ok:0, guess:null, vote:null };
const opts = () => `<div class="opts">${[1952,1960,1971].map(y => `<button data-guess="${y}" class="${st.guess == null ? '' : y === 1960 ? 'yes' : 'no'}" ${st.guess == null ? '' : 'disabled'}>${y === 1960 && st.guess != null ? (st.guess === 1960 ? 'Yes! 1960' : 'It\'s 1960') : y}</button>`).join('')}</div>`;
const pic = i => S[i](i) + (HOOK[i] ? `<p class="hook" style="${DARK[i] ? 'color:#24405e' : ''}">${HOOK[i]}</p>` : '') + (i === 0 ? opts() : '');
const card = (i, live) => `<article class="card ${live ? 'live' : ''}" data-i="${i}" aria-label="${DAYS[i]}, sample post"><div class="who"><i>H</i><span><b>harveysonbeverly</b>${DAYS[i]}</span><em>Sample</em></div><div class="pic">${pic(i)}</div><p class="cap"><b>harveysonbeverly</b>${CAP[i]}</p></article>`;
const pips = () => `<div class="pips" aria-hidden="true">${DAYS.map((_, k) => `<i class="${k === st.i ? 'on' : ''}"></i>`).join('')}</div>`;
let timers = []; const later = (f, ms) => timers.push(setTimeout(f, ms)); const stop = () => { timers.forEach(clearTimeout); timers = []; };
const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;

const V = [
  () => `<div class="say"><h1>You take a photo.</h1><p>A few good photos.</p></div>
    <div class="phone in"><div class="glass"><div class="view">${SHOP()}<i></i><i></i><i></i><i></i></div><div class="cam"><button class="shut" data-a="snap" aria-label="Take the photo"></button><b>Tap to take it</b></div></div></div>
    <div class="act"><p class="fine" style="margin-top:0">Scripted demo. The posts were written ahead of time, and nothing gets posted. The pieces are our drawings, where your photos would go. The motion in the posts is part of this demo.</p></div>`,
  () => `<div class="say"><h1>Here's your week.</h1><p>Five posts. Flip through them.</p></div>
    <div class="phone in"><button class="arr l" data-a="prev" aria-label="Previous post">‹</button><button class="arr r" data-a="next" aria-label="Next post">›</button><div class="glass"><div class="feed" tabindex="0" aria-label="Five sample posts">${DAYS.map((_, k) => card(k, k === st.i)).join('')}</div>${pips()}</div></div>
    <div class="act"><button class="go" data-a="next"></button></div>`,
  () => st.ok < 5 ? `<div class="say"><h1>You say yes.</h1><p>Nothing goes out until you do.</p></div>
    <div class="phone"><div class="glass"><div class="in" style="flex:1;display:flex;min-height:0">${card(st.ok, true)}</div></div></div>
    <div class="act"><button class="go" data-a="yes">Yes to ${DAYS[st.ok]}</button></div>`
  : `<div class="say"><h1>That's the week.</h1><p>You took a few photos and said yes. Want this for your showroom?</p></div>
    <div class="phone sm in"><div class="glass"><div class="week">${DAYS.map((d, k) => `<div>${pic(k).replace('xMidYMax', 'xMidYMid')}<b>${d.slice(0, 3)} ✓</b></div>`).join('')}</div></div></div>
    <div class="act"><a class="go" href="https://calendar.app.google/x9bPju4vi61FBud66" target="_blank" rel="noopener">Book a time</a><button class="lnk" data-a="listing">and the listing too</button><button class="lnk" data-a="again">Start over</button><p class="fine" style="margin-top:2px">Nothing was posted. Harveys On Beverly didn't make this and isn't a Handoff client.</p></div>`,
];
function render(){ $('#app').innerHTML = V[st.s](); if (st.s === 1) { const f = $('.feed'); f.scrollLeft = st.i * f.clientWidth; f.addEventListener('scroll', onScroll, {passive:true}); mark(); } }
function go(s){ stop(); st.s = s; render(); scrollTo(0, 0); }
function onScroll(){ const f = $('.feed'); if (!f || !f.clientWidth) return; const i = Math.max(0, Math.min(4, Math.round(f.scrollLeft / f.clientWidth))); if (i !== st.i) { st.i = i; mark(); } }
function mark(){
  $$('.feed .card').forEach((c, k) => { c.classList.toggle('live', k === st.i); c.inert = k !== st.i; });
  $$('.pips i').forEach((p, k) => p.classList.toggle('on', k === st.i));
  const g = $('.act .go'); if (g) g.textContent = st.i < 4 ? 'Next post' : 'Now you say yes';
  const l = $('.arr.l'), r = $('.arr.r'); if (l) { l.disabled = st.i === 0; r.disabled = st.i === 4; }
}
function slide(d){ const f = $('.feed'), i = Math.max(0, Math.min(4, st.i + d)); if (i === st.i) return; st.i = i; mark(); f.removeEventListener('scroll', onScroll); f.scrollTo({ left:i * f.clientWidth, behavior:calm ? 'auto' : 'smooth' }); clearTimeout(slide.t); slide.t = setTimeout(() => { f.addEventListener('scroll', onScroll, {passive:true}); }, 650); }
function repaint(i){ $$(`.card[data-i="${i}"] .pic`).forEach(p => p.innerHTML = pic(i)); }
let busy = false;
const A = {
  snap(){ if (busy) return; busy = true; const g = $('.glass'), p = [['-56%','-58%','-11deg'],['56%','-58%','9deg'],['-58%','52%','7deg'],['58%','52%','-8deg'],['0%','-4%','-2deg']];
    g.insertAdjacentHTML('beforeend', `<div class="fan">${p.map(v => `<span style="--x:${v[0]};--y:${v[1]};--r:${v[2]}">${SHOP()}</span>`).join('')}<b>Now, your week.</b></div><div class="flash"></div>`);
    later(() => { busy = false; st.i = 0; go(1); }, calm ? 900 : 1900); },
  next(){ if (st.i < 4) slide(1); else go(2); },
  prev(){ slide(-1); },
  yes(){ if (busy) return; busy = true; $('.pic').insertAdjacentHTML('beforeend', '<div class="stamp">Yes</div>'); later(() => { busy = false; st.ok++; go(2); }, 750); },
  again(){ Object.assign(st, { i:0, ok:0, guess:null, vote:null }); go(0); },
  listing(){ $('#dlg').innerHTML = LISTING; $('#dlg').showModal(); $('#dlg').scrollTop = 0; },
  shut(){ $('#dlg').close(); },
};
const FACTS = [['Price','$9,500.00'],['Size','32" tall x 76" wide x 31" deep'],['Seat','17.5"'],['Designer','Lawrence Peabody'],['Maker','Nemschoff'],['Collection','The Peabody Collection for Richardson Nemschoff'],['Model','98632'],['Frame','Sculptural walnut'],['Year','1960'],['From','United States'],['SKU','20N02150.4MS'],['Status','Available for sale']];
const LISTING = `<div class="lst"><h2 tabindex="-1" autofocus>Mid-century Model 98632 Arched Wing Back Sofa by Lawrence Peabody for Nemschoff</h2><p>The Model 98632 arched wing back sofa by Lawrence Peabody, from The Peabody Collection for Richardson Nemschoff. It has a sculptural walnut frame. United States, 1960.</p><dl>${FACTS.map(r => `<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('')}<div><dt>Condition</dt><dd class="b">You fill this in</dd></div><div><dt>Upholstery</dt><dd class="b">You fill this in</dd></div></dl><p style="font-size:14px;color:#6d5544">A sample listing, from Harveys On Beverly's public page for this sofa. If the page doesn't say, it stays blank.</p><button class="go" data-a="shut">Close</button></div>`;
document.addEventListener('click', e => {
  const g = e.target.closest('[data-guess]'); if (g) { st.guess = +g.dataset.guess; return repaint(0); }
  const v = e.target.closest('[data-vote]'); if (v) { st.vote = +v.dataset.vote; const w = v.parentNode; w.className = 'vote v' + st.vote; w.querySelectorAll('span').forEach((s, k) => s.textContent = (k === st.vote ? 'You picked the ' : 'The ') + ['sputnik','sofa'][k]); return; }
  const b = e.target.closest('[data-a]'); if (b && !b.disabled) A[b.dataset.a]();
});
document.addEventListener('keydown', e => { if (st.s === 1 && e.key === 'ArrowRight') { e.preventDefault(); slide(1); } if (st.s === 1 && e.key === 'ArrowLeft') { e.preventDefault(); slide(-1); } });
addEventListener('resize', () => { const f = $('.feed'); if (f) f.scrollLeft = st.i * f.clientWidth; });
render();
})();
</script>
